name: 🚀 Deploy Preguntados to InfinityFree

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preguntados-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:

      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar PHP y Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
 
      - name: Instalar dependencias de Composer
        run: composer install --no-dev --prefer-dist --optimize-autoloader

      - name: Simular publicacion por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: /htdocs/
          dry-run: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/config/config.ini
            **/config/mail.ini
            **/.env
            **/node_modules/**

